name: domain-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  repository-identity:
    name: Repository identity (fail closed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Belt beyond the guard script itself: this workflow must never act on a
      # different repository (e.g. a fork named simple-walk-game).
      - name: Enforce GITHUB_REPOSITORY
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -ne 'quantdale/walk-game') {
            Write-Host "GITHUB_REPOSITORY '$env:GITHUB_REPOSITORY' != 'quantdale/walk-game'" -ForegroundColor Red
            exit 1
          }

      - name: Assert repository identity
        shell: pwsh
        run: ./scripts/Assert-RepoIdentity.ps1 -CiMode

  agent-guards:
    name: Agent guard suites (identity / writer lock / race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run deterministic guard tests (pwsh + sh implementations)
        shell: pwsh
        run: ./scripts/Test-AgentGuards.ps1

  verify-domain:
    name: Standalone domain suite (.NET)
    runs-on: ubuntu-latest
    needs: [repository-identity]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore + run domain tests
        shell: pwsh
        run: ./scripts/verify-domain.ps1

      - name: Validate Unity project statically
        shell: pwsh
        run: ./scripts/verify-unity-static.ps1

      - name: Release hygiene and privacy audit
        shell: pwsh
        run: ./scripts/verify-release-hygiene.ps1

      # Unity compile/EditMode/PlayMode gates require an editor license;
      # scripts/verify-unity-editmode.ps1 is the documented local equivalent until a
      # licensed runner exists (see docs/TESTING_AND_PERFORMANCE.md).
